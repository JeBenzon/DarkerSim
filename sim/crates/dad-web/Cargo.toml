[package]
name = "dad-web"
edition.workspace = true
version.workspace = true

[dependencies]
dad-core = { path = "../dad-core" }
leptos = { version = "0.8", features = ["csr"] }
gloo-net = { version = "0.6", default-features = false, features = ["http"] }
serde = "1"
serde_json = "1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Storage", "Window", "Performance", "HtmlInputElement", "KeyboardEvent", "WheelEvent", "MouseEvent", "EventSource", "MessageEvent"] }
console_error_panic_hook = "0.1"
