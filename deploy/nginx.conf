server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/wasm application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # trunk fingerprints the .js/.wasm/.css file names (dad-web-<hash>.js, dad-web-<hash>_bg.wasm),
    # so they can be cached forever. The regex is quoted because nginx reads a bare { as a block.
    location ~* "-[0-9a-f]{16}(_bg)?\.(js|wasm|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # game data and icons keep their names across patches
    location ~* \.(json)$ { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location /icons/ { add_header Cache-Control "public, max-age=86400"; try_files $uri =404; }

    # single-page app
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
